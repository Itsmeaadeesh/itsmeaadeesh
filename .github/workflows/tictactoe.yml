name: Tic Tac Toe Game Engine

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  play:
    if: startsWith(github.event.issue.title, 'ttc|')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Tic Tac Toe Move
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: |
          python .github/scripts/tictactoe.py "$ISSUE_TITLE" "$ISSUE_USER"

      - name: Commit & Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md data/
          git diff --staged --quiet || (git commit -m "chore(game): update tic-tac-toe state [skip ci]" && git push)

      - name: Close and Comment on Issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let comment = 'Thanks for playing! The README board has been updated. Go check it out on the profile!';
            try {
              if (fs.existsSync('data/tictactoe_last_message.txt')) {
                comment = fs.readFileSync('data/tictactoe_last_message.txt', 'utf8');
              }
            } catch(e) {}
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed'
            });
